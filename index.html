<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eden</title>
    <link rel="icon" type="image/webp" href="icon.webp" />
    <link rel="stylesheet" href="eden.css" />
  </head>
  <body>
    <header class="eden-header">
      <div class="container header-inner">
        <a href="#/" class="brand">
          <img src="images/logo.png" alt="" class="brand-logo" />
          <span class="brand-name">Eden</span>
        </a>

        <nav class="nav">
          <a href="#/" data-nav="home">Accueil</a>
          <a href="#/alternatives" data-nav="alternatives">Alternatives</a>
          <a href="#/about" data-nav="about">À propos</a>
        </nav>

        <div class="search-wrap">
          <img src="images/search.png" alt="" class="search-icon" />
          <input
            type="search"
            id="searchInput"
            placeholder="Rechercher un logiciel..."
            autocomplete="off"
          />
        </div>
      </div>
    </header>

    <main id="app" class="container"></main>

    <footer class="eden-footer">
      <div class="container">
        <p>Le jardin des alternatives libres.</p>
      </div>
    </footer>

    <script src="eden.js"></script>
  </body>
</html>
