<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eden</title>
    <link rel="icon" type="image/webp" href="icon.webp" />
    <link rel="stylesheet" href="eden.css" />
    <script>
      (function () {
        var saved = localStorage.getItem("eden.theme");
        var theme = saved === "dark" || saved === "light"
          ? saved
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <header class="eden-header">
      <div class="container-eden header-inner">
        <a href="#/" class="brand">
          <img src="images/logo.png" alt="" class="brand-logo" />
          <span class="brand-name">Eden</span>
        </a>

        <nav class="nav">
          <a href="#/" data-nav="home" data-i18n="nav.home">Accueil</a>
          <a href="#/alternatives" data-nav="alternatives" data-i18n="nav.alternatives">Alternatives</a>
          <a href="#/about" data-nav="about" data-i18n="nav.about">À propos</a>

          <div class="lang-menu">
            <button class="lang-trigger" id="langTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span id="langLabel">English</span>
              <span class="lang-caret"></span>
            </button>
            <ul class="lang-list" id="langList" role="listbox" aria-label="Language">
              <li role="option" data-lang="en">English</li>
              <li role="option" data-lang="fr">Français</li>
            </ul>
          </div>

          <div class="lang-menu">
            <button class="lang-trigger" id="themeTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span id="themeLabel">Light</span>
              <span class="lang-caret"></span>
            </button>
            <ul class="lang-list" id="themeList" role="listbox" aria-label="Theme">
              <li role="option" data-theme="light">Light</li>
              <li role="option" data-theme="dark">Dark</li>
            </ul>
          </div>
        </nav>

        <div class="search-wrap">
          <img src="images/search.png" alt="" class="search-icon" />
          <input
            type="search"
            id="searchInput"
            placeholder="Search a software..."
            autocomplete="off"
          />
        </div>
      </div>
    </header>

    <main id="app" class="container-eden app-centered"></main>

    <footer class="eden-footer">
      <div class="container-eden">
        <p data-i18n="footer.tagline">© 2026 Eden - The garden of alternatives.</p>
      </div>
    </footer>

    <script src="eden.js"></script>
  </body>
</html>
